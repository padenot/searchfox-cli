name: Publish crates

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify authentication and packages without uploading
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          version = manifest['workspace']['package']['version']
          if os.environ['DRY_RUN'] != 'true':
              expected = f'v{version}'
              if os.environ['RELEASE_REF_TYPE'] != 'tag' or os.environ['RELEASE_REF'] != expected:
                  raise SystemExit(f'Publishing requires the {expected} tag')
          PYTHON

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          manifest = tomllib.loads(Path('Cargo.toml').read_text())
          version = manifest['workspace']['package']['version']
          dry_run = os.environ['DRY_RUN'] == 'true'
          for crate in ['searchfox-lib', 'searchfox-cli']:
              if not dry_run:
                  url = f'https://crates.io/api/v1/crates/{crate}/{version}'
                  request = urllib.request.Request(url, headers={'User-Agent': 'searchfox-cli release workflow'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          published = json.load(response)['version']
                      if published['yanked']:
                          raise SystemExit(f'{crate} {version} is yanked; refusing to skip it')
                      print(f'{crate} {version} is already published; skipping', flush=True)
                      continue
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
              command = ['cargo', 'publish', '--locked', '-p', crate]
              if dry_run:
                  command.append('--dry-run')
              subprocess.run(command, check=True)
          PYTHON
